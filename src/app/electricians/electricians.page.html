<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>Electricians List</ion-title>
    <ion-buttons slot="start">
      <ion-button  [routerLink]="['/home']"  >
        <ion-icon color="light" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button size="small" (click)="openElectricianForm()" fill="outline" color="light">
      Add electrician
      </ion-button>
    </ion-buttons>

  </ion-toolbar>
  <ion-searchbar  placeholder="Search" animated  mode="md" clearIcon="close-circle-sharp" (ionChange)="onSearchTerm($event)"></ion-searchbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>

 <ion-card *ngFor="let electrician of electricians"
