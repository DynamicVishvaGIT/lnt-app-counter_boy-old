<ion-header>
  <ion-toolbar>
    <ion-title>Points History</ion-title>
    <ion-buttons slot="start">
      <ion-button  [routerLink]="['/home']"  >
        <ion-icon color="light" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card mode="ios">
    <ion-row class="points-row">
      <ion-col size="8" >
        <p class="header">Date</p>
        <p class="value">24 Jan,2021</p>
      </ion-col>
      <ion-col size="4">
        <p class="header">Accumulated Points</p>
        <p class="value">150000</p>
      </ion-col>  
    </ion-row>
  </ion-card>
  <ion-card mode="ios">
    <ion-row class="points-row">
      <ion-col size="8" >
        <p class="header">Date</p>
        <p class="value">1 Feb,2021</p>
      </ion-col>
      <ion-col size="4">
        <p class="header">Accumulated Points</p>
        <p class="value">235000</p>
      </ion-col>
    </ion-row>
  </ion-card>
</ion-content>
