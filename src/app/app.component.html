    <ion-tab-bar selectedTab="{{tab_name}}"  *ngIf="tab_name ==='home' || tab_name ==='profile'|| tab_name ==='redeem'|| tab_name ==='scancode'" slot="bottom" >

      <ion-tab-button  tab="home" >
        <ion-icon name="home" size="small" ></ion-icon>
        <ion-label >Dashboard</ion-label>
      </ion-tab-button> 
      <ion-tab-button  tab="feedback" class="comments">
        <ion-icon name="reader" size="small" ></ion-icon>
        <ion-label >Feedback</ion-label>
      </ion-tab-button> 
      <ion-tab-button  tab="redeem" class="comments">
        <ion-icon name="gift" size="small" ></ion-icon>
        <ion-label >Gift Redeem</ion-label>
      </ion-tab-button>
