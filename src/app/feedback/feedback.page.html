<ion-header>
  <ion-toolbar>
    <ion-title>Feedback</ion-title>
    <ion-buttons slot="start">
      <ion-button  [routerLink]="['/home']"  >
        <ion-icon color="light" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button size="small" (click)="openFeedbackForm()" fill="outline" color="light">
      Add Feedback
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
  <div *ngIf="feedback">
  <ion-card  mode="ios" *ngFor="let fbk of feedback">
   <ion-row class="ion-margin-top">
     <ion-col size="12">
       <ion-row>
         <ion-col size="2" class="icon-col">
           <ion-icon class="list-icon" name="person-outline" ></ion-icon>
         </ion-col>
         <ion-col size="10">
           <ion-list >
             <ion-label class="label-heading">Name </ion-label>
             <br>
             <ion-label class="label-value" >{{fbk.name|titlecase}}</ion-label>
            
           </ion-list>
         </ion-col>
       </ion-row>
     
     </ion-col>
     <ion-col size="12">
       <ion-row>
         <ion-col size="2" class="icon-col">
           <ion-icon  class="list-icon" name="reader-outline" ></ion-icon>
         </ion-col>
         <ion-col size="10">
           <ion-list >
             <ion-label class="label-heading">Subject </ion-label>
             <br>
             <ion-label class="label-value">{{fbk.subject}}</ion-label>
           </ion-list>
         </ion-col>
       </ion-row>
      
     </ion-col>
     </ion-row>
     <ion-row class="ion-margin-bottom">
       <ion-col size="12">
       <ion-row>
         <ion-col size="2" class="icon-col">
           <ion-icon  class="list-icon" name="reader-outline" ></ion-icon>
         </ion-col>
         <ion-col size="10">
           <ion-list >
             <ion-label class="label-heading"> Message </ion-label>
             <br>
             <ion-label class="label-value">{{fbk.message|slice:20}}
            <div  *ngIf="fbk.isShow">
              {{fbk.message}}
            </div> <ion-button (click)="viewMore(fbk)" color="secondary">
              View More
            </ion-button>
              
           

             </ion-label>
           </ion-list>
         </ion-col>
       </ion-row>
       </ion-col>
    
     </ion-row>
  </ion-card>
</div>
<div *ngIf="!dataPresent" class="electrician-card">
  <!-- <ion-card class="no-items"> -->
    <p class="ion-text-center"><b>No Feedback</b> </p>
  <!-- </ion-card> -->
</div>
</ion-content>
