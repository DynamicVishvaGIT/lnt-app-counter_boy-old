<ion-header>
  <ion-toolbar>
    <ion-title>Passbook Details</ion-title>
    <ion-buttons slot="start">
      <ion-button [routerLink]="['/passbook']"  >
        <ion-icon color="light" name="arrow-back-sharp"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
  <div *ngIf="passbook">
    <ion-card class="order-card" mode="ios" *ngFor="let item of passbook" >
      <ion-row >
        <ion-col size="8">
          <p class="header">Name</p>
          <p class="value">{{item.electricianFullName |titlecase}}</p>
        </ion-col>

      </ion-row>
      <ion-row >
        <ion-col size="6">
          <p class="header">Points</p>
          <p class="value">{{item.point}}</p>
        </ion-col>
        <ion-col size="6">
          <p class="header">Mobile Number</p>
          <p class="value">{{item.username}}</p>
        </ion-col>
      </ion-row>
    </ion-card>
  </div>
</ion-content>
